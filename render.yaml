services:
  - type: web
    name: parentpeak-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    # Prisma-Migrationen laufen genau einmal pro Deploy nach dem Build und vor
    # dem Umschalten auf die neue Instanz. DATABASE_URL kommt aus dem Render-
    # Service-Environment. Migrationen sind additiv/abwärtskompatibel.
    preDeployCommand: npm run migrate:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_AUTH_FOR_WRITES
        value: "1"
      - key: FIREBASE_REQUIRE_AUTH
        value: "1"
      - key: ALLOW_CLIENT_PROVIDER_EVENTS
        value: "0"
      - key: STRIPE_WEBHOOK_TOLERANCE_SEC
        value: "300"
      - key: WRITE_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: WRITE_RATE_LIMIT_MAX
        value: "120"
      # Dediziertes, strengeres Limit für den teuren KI-Endpunkt (/ai/generate),
      # pro Nutzer: schützt die Gemini-Kosten gegen Missbrauch.
      - key: AI_RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: AI_RATE_LIMIT_MAX
        value: "30"
      # Globales Tages-Hard-Cap über ALLE KI-Aufrufe (Kostenschutz, auch bei
      # vielen Konten). 0 = deaktiviert. Bei Erreichen: 503 bis Mitternacht UTC.
      - key: AI_DAILY_BUDGET_MAX
        value: "2000"
      - key: WEEKLY_IMPULSE_SCHEMA_PATH
        value: "/opt/render/project/backend/weekly_impulse_schema_year3.json"
      - key: DISABLE_IN_MEMORY_FALLBACKS
        value: "1"
      - key: ALLOW_DEMO_BOOTSTRAP
        value: "0"
      - key: BACKEND_API_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://parentpeak.onrender.com,https://parentpeak.de"
      - key: GEMINI_API_KEY
        sync: false
      - key: INTERNAL_MODERATOR_EMAILS
        sync: false
      - key: INTERNAL_MODERATOR_DOMAINS
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
