name: parentpeak
description: Parentpeak App
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_auth: ^6.5.4
  firebase_messaging: ^16.3.0
  shared_preferences: ^2.0.15
  intl: ^0.20.2
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^10.3.1
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_svg: ^2.2.3
  flutter_tts: ^4.2.5
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  video_player: ^2.9.2
  just_audio: ">=0.9.46 <0.11.0"
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  printing: ^5.14.3
  crypto: ^3.0.7
  flutter_stripe: ">=13.0.0 <15.0.0"
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1
  firebase_storage: ^13.4.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  mockito: ^5.3.2
  mocktail: ^1.0.5
  flutter_lints: ^2.0.0
  build_runner: ^2.3.3
  flutter_launcher_icons: ^0.14.4

# App launcher / store icons. Source art lives in assets/images/AppIcons.
# Regenerate after changing the art: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: "assets/images/AppIcons/appstore.png"
  # iOS: App Store rejects alpha; flatten onto the icon's warm background.
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FBEAD2"
  # Android: adaptive icon (foreground art already has a safe margin baked in).
  android: "ic_launcher"
  adaptive_icon_background: "#FBEAD2"
  adaptive_icon_foreground: "assets/images/AppIcons/android/adaptive-foreground.png"
  min_sdk_android: 21
  # Web: favicon + PWA icons (incl. maskable).
  web:
    generate: true
    image_path: "assets/images/AppIcons/appstore.png"
    background_color: "#FBEAD2"
    theme_color: "#1E5CD7"

flutter:
  uses-material-design: true
  assets:
    # Placeholder env only. Real secrets are injected via --dart-define at build time.
    # The real local .env is NEVER bundled (would leak keys in APK/Web build).
    - assets/env.template
    - assets/images/
    - assets/icons/