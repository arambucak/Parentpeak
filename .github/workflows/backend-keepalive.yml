name: Backend Keep-Alive Ping

# Pings the Render backend every 14 minutes to prevent cold starts.
# Render Free Tier sleeps after 15 min inactivity → first request takes 30-60s.
# This workflow ensures the backend is always warm for users.

on:
  schedule:
    # Every 14 minutes (GitHub Actions minimum is 5 min)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging backend at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://parentpeak.onrender.com/health)
          echo "Response: HTTP $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Backend is alive"
          else
            echo "⚠️ Backend returned $STATUS (may be waking up)"
          fi
