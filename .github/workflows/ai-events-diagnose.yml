name: AI Events Diagnose (read-only)

# Ruft den produktiven /ai/generate-Proxy mit Google-Search-Grounding auf,
# genau wie der EventDiscoveryAgent, um zu sehen, was Gemini real zurückliefert.
# Nur Lesezugriff auf die KI (keine Datenänderung). Nutzt BACKEND_API_TOKEN.

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Stadt/Stadtteil'
        required: false
        default: 'Berlin-Kreuzberg'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secret prüfen
        env:
          TOKEN: ${{ secrets.BACKEND_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::BACKEND_API_TOKEN nicht gesetzt."; exit 1
          fi

      - name: Grounding-Call absetzen
        env:
          TOKEN: ${{ secrets.BACKEND_API_TOKEN }}
          CITY: ${{ github.event.inputs.city }}
        run: |
          set -euo pipefail
          BASE="https://parentpeak.onrender.com"
          PROMPT="Heute. Finde bis zu 5 belegte Familienevents in \"${CITY}\" (20 km Umkreis), Herbst. Zielgruppe: Kinder verschiedener Altersgruppen (0-16 Jahre). Nutze Google Search. Antworte nur als kompaktes JSON-Array. Pro Treffer: title, description, category, ageLabels, location, eventDate, price, url, organizer. Ohne Treffer []."
          BODY=$(node -e "console.log(JSON.stringify({model:'gemini-3.5-flash',prompt:process.env.PROMPT,useGoogleSearch:true,language:'de'}))" PROMPT="$PROMPT")
          echo "--- POST $BASE/ai/generate (model=gemini-3.5-flash, grounding=on) ---"
          RESP=$(curl -sS -w '\n%{http_code}' -X POST "$BASE/ai/generate" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$BODY" --max-time 60)
          STATUS="${RESP##*$'\n'}"
          JSON="${RESP%$'\n'*}"
          echo "HTTP $STATUS"
          echo "--- Rohe Proxy-Antwort (gekürzt) ---"
          echo "$JSON" | head -c 4000
          echo
          echo "--- Analyse ---"
          node -e '
            const fs=require("fs");
            let data={};
            try{ data=JSON.parse(process.argv[1]); }catch(e){ console.log("Proxy-Antwort ist kein JSON:", e.message); process.exit(0); }
            if(data.error){ console.log("Proxy-Fehler:", data.error); process.exit(0); }
            const text=String(data.text||"");
            console.log("Textlänge:", text.length);
            console.log("Grounding-URLs:", (data.groundingUrls||[]).length);
            const start=text.indexOf("["); const end=text.lastIndexOf("]");
            if(start<0){ console.log("KEIN JSON-Array im Text (kein \"[\"). Erste 500 Zeichen:"); console.log(text.slice(0,500)); process.exit(0); }
            const chunk=text.slice(start,end+1);
            try{ const arr=JSON.parse(chunk); console.log("JSON-Array parsebar, Einträge:", Array.isArray(arr)?arr.length:"n/a"); }
            catch(e){ console.log("JSON-Array NICHT parsebar:", e.message); console.log("Chunk-Anfang:", chunk.slice(0,500)); }
          ' "$JSON"
